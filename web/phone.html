<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="JARVIS" />
<meta name="theme-color" content="#03060a" />
<title>J.A.R.V.I.S.</title>
<style>
  :root { --amber:#ffb24d; --amber2:#ffce92; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; min-height:100%; background:#03060a; color:var(--amber2);
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom)); }
  h1 { font-size:17px; letter-spacing:3px; font-weight:600; color:var(--amber);
    text-align:center; margin:4px 0 16px; }
  h1 .dot { display:inline-block; width:8px; height:8px; border-radius:50%;
    background:var(--amber); box-shadow:0 0 10px var(--amber); margin-right:8px;
    vertical-align:middle; animation:pulse 2.4s infinite; }
  @keyframes pulse { 0%,100%{opacity:.45;} 50%{opacity:1;} }
  .card { background:rgba(10,7,3,.6); border:1px solid rgba(255,178,77,.25);
    border-radius:16px; padding:16px; margin-bottom:14px; backdrop-filter:blur(6px); }
  #preview { width:100%; border-radius:12px; display:none; margin-bottom:12px;
    border:1px solid rgba(255,178,77,.25); }
  label.shoot { display:flex; align-items:center; justify-content:center; gap:10px;
    background:linear-gradient(180deg,#ffd27f,#ff9a3c); color:#241400; font-weight:700;
    font-size:17px; padding:16px; border-radius:14px; cursor:pointer; }
  input[type=file] { display:none; }
  input[type=text] { width:100%; background:rgba(255,178,77,.08); color:var(--amber2);
    border:1px solid rgba(255,178,77,.3); border-radius:12px; padding:13px 14px;
    font-size:15px; outline:none; margin-top:12px; }
  button.send { width:100%; margin-top:12px; background:rgba(255,178,77,.16);
    color:var(--amber); border:1px solid rgba(255,178,77,.4); border-radius:12px;
    padding:14px; font-size:16px; font-weight:600; }
  button.send:disabled { opacity:.4; }
  #reply { font-size:16px; line-height:1.6; color:#ffe2bf; white-space:pre-wrap; min-height:24px; }
  #status { text-align:center; font-size:13px; opacity:.6; min-height:18px; margin-top:6px; }
  .muted { opacity:.55; font-size:12.5px; text-align:center; line-height:1.6; }
  .spin { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,178,77,.3);
    border-top-color:var(--amber); border-radius:50%; animation:rot .8s linear infinite;
    vertical-align:middle; margin-right:6px; }
  @keyframes rot { to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <h1><span class="dot"></span>J.A.R.V.I.S.</h1>

  <div class="card">
    <img id="preview" alt="" />
    <label class="shoot" for="file">◎ Scan something</label>
    <input id="file" type="file" accept="image/*" capture="environment" />
    <input id="prompt" type="text" placeholder="Ask about it… (optional)" />
    <button class="send" id="send" disabled>Send to Jarvis</button>
    <div id="status"></div>
  </div>

  <div class="card" id="replycard" style="display:none">
    <div id="reply"></div>
  </div>

  <div class="muted" id="pairmsg"></div>

<script>
const qs = new URLSearchParams(location.search);
// persist the token so the home-screen app keeps working without the query string
let token = qs.get('token') || localStorage.getItem('jarvis_token') || '';
if (qs.get('token')) localStorage.setItem('jarvis_token', token);

const fileEl = document.getElementById('file');
const preview = document.getElementById('preview');
const sendBtn = document.getElementById('send');
const promptEl = document.getElementById('prompt');
const statusEl = document.getElementById('status');
const replyCard = document.getElementById('replycard');
const replyEl = document.getElementById('reply');
let imageData = null;

if (!token) document.getElementById('pairmsg').textContent =
  'Not paired. Open the link (or scan the QR) Jarvis shows on the desktop.';

function downscale(file){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const max = 1280, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.85));
    };
    img.src = URL.createObjectURL(file);
  });
}

fileEl.addEventListener('change', async () => {
  const f = fileEl.files[0];
  if (!f) return;
  imageData = await downscale(f);
  preview.src = imageData; preview.style.display = 'block';
  sendBtn.disabled = !token;
  statusEl.textContent = '';
});

async function speak(text){
  try {
    if (!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.0; u.pitch = 1.0;
    const v = speechSynthesis.getVoices().find(v => /UK|British|Daniel|George|Arthur/i.test(v.name));
    if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}

sendBtn.addEventListener('click', async () => {
  if (!imageData || !token) return;
  sendBtn.disabled = true;
  statusEl.innerHTML = '<span class="spin"></span> Jarvis is looking…';
  replyCard.style.display = 'none';
  try {
    const r = await fetch('/scan', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ token, image: imageData, prompt: promptEl.value })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    statusEl.textContent = '';
    replyEl.textContent = d.commentary;
    replyCard.style.display = 'block';
    speak(d.commentary);
  } catch (e) {
    statusEl.textContent = '⚠ ' + e.message;
  } finally {
    sendBtn.disabled = false;
  }
});
</script>
</body>
</html>
